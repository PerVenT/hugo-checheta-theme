{{ define "main" }}
<main class="container page">
  <h1>{{ .Title }}</h1>
  {{- with .Params.lead }}<p class="page__lead">{{ . }}</p>{{ end }}
  {{- with partial "product/upcoming.html" (dict "limit" 0) }}
  <div class="grid">{{ range . }}{{ partial "product/card.html" . }}{{ end }}</div>
  {{- end }}
</main>
{{ end }}
