name: Demo

# exampleSite on GitHub Pages, published after tests pass on main.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.167.0"
  GO_VERSION: "1.27"

jobs:
  build:
    # Only pushes to main of this repository: Test also runs for pull requests, including from forks.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
      # The demo's Umami values are for tests only; no analytics script on the public demo.
      HUGO_PARAMS_UMAMI_SRC: ""
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Hugo extended
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --source exampleSite --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --destination "${{ runner.temp }}/demo"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
